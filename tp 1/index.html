<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main class="pantalla">
        <section class="seccion-1">
            <div class="xdpapa">
            <div class="barra-busqueda">
                <input class="input">
            </div>
            <article class="cuadrado-negro"></article>
        </div>
            <div class="xd">
                <article class="texto">texto texto texto </article>
                <article class="texto">texto texto texto </article>
                <article class="texto">texto texto texto </article>
                <article class="texto">texto texto texto </article>
            </div>
        </section>
        <section class="seccion-2">
            <div class="dumb">
            <article class="cuadradito rojo"></article>
        </div>
            <div class="texto">
                <h1>TITULO</h1>
                <p>texto texto texto texto</p>
                <p>texto texto texto texto</p>
                <p>texto texto texto texto</p>
            </div>
        </section>
        <section class="seccion-3">
            <div class="coso">
                <article class="cuadradito rojo">
                    <h1 class="titulo">TITULO</h1>
                    <p class="textok">texto texto texto texto</p>
                    </article>
                <div class="texto"><p>texto texto texto texto</p></div>
            </div>
            <div class="coso">
                <article class="cuadradito azul"></article>
                <div class="texto">
                    <p>texto texto texto texto</p></div>
            </div>
            <div class="coso">
                    <article class="cuadradito amarillo"></article>
                    <div class="texto"><p>texto texto texto texto</p></div>
            </div>
            
        </section>
    </main>
    <style> 
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    }

    html, body {
    height: 100%;
    margin: 0;
    }
    .main{
        height: 100dvh;
        width: 100dvw;
    }
        .seccion-1{
            height: 25dvh;
            width: 100dvw;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .seccion-2{
            height: 35dvh;
            width: 100dvw;
            background-color:#c4edf1;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
        }
        .seccion-3{
            height: 40dvh;
            width: 100dvw;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-evenly;
        }
        .barra-busqueda{
            height:7dvh;
            width: 32dvw;
            background-color: #ff9978;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
        }
        .xdpapa{
            display: flex;
            flex-direction: row;
            margin-top: 8dvh;
        }
        .xd{
            flex: 1;
            width: 100dvw;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-evenly;
        }
        .input{
           height: 4dvh;
           width:30dvw;
        }
        .dumb{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50dvw;
        }
        .cuadrado-negro{
            display: flex;
            height: 7dvh;
            width: 6dvw;
            background-color: black;
        }

        .coso{
            width: 10dvw;
            height: 30dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .cuadradito{
        width: 10dvw;
        aspect-ratio: 1/1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        flex-direction: column;
    }
    .texto{
        display: flex;
        flex:1;
        overflow-wrap: break-word;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }
    .textok{
        display: flex;
        flex:1;
        overflow-wrap: break-word;
        flex-direction: column;
        margin: 2dvh;
    }
    .titulo{
        margin-top: 2dvh;
        margin-bottom: 0;
    }
    .azul{
        background-color: 
        #abe0e5;
    }
    .rojo{
        background-color: 
        #ff9978;
    }
    .amarillo{
        background-color: 
        #ffc86d;
    }
    </style>
</body>
</html>
