<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancha de Fútbol</title>
</head>
<body>
    <section class="cancha">
        <section class="arco">
            <article class="jugador">
                <p class="nombre">1</p>
                <p class="nombre">DIBU</p>
            </article>
        </section>
        <section class="defensa">
            <article class="jugador">
                <p class="nombre">1</p>
                <p class="nombre">GOROSITO</p>
            </article>
            <article class="jugador">
                <p class="nombre">2</p>
                <p class="nombre">ROMERO</p>
            </article>
            <article class="jugador">
                <p class="nombre">3</p>
                <p class="nombre">MARTÍNEZ</p>
            </article>
            <article class="jugador">
                <p class="nombre">4</p>
                <p class="nombre">TAGLIAFICO</p>
            </article> 
        </section>
        

        <section class="mediocampo">
            <article class="jugador">
                <p class="nombre">FERNANDEZ</p>
            </article>
            <article class="jugador">
                <p class="nombre">PAREDES</p>
            </article>
            <article class="jugador">
                <p class="nombre">COLO</p>
            </article> 
        </section>

        <section class="ataque">
            <article class="jugador">
                <p class="nombre">DI MARIA</p>  
            </article>
            <article class="jugador">
                <p class="nombre">ALVAREZ</p>
            </article>
            <article class="jugador">
                <p class="nombre">MESSI</p>
            </article>
        </section>
    </section>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

    html, body {
    height: 100%;
    margin: 0;
}

body {
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
}

.cancha {
    height: 90%;
    aspect-ratio: 1/1;
    background-color: darkgreen;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-width: 4px;
    border-color: white;
    border-style: solid;
    border-radius: 1%;
}
.arco{
    height: 15%;
    background-color: chartreuse;
    display: flex;
    flex-direction: row;
    justify-content: space-evenly;
    align-items: center;
}
.defensa{
    height: 15%;
    background-color: chartreuse;
    display: flex;
    flex-direction: row;
    justify-content: space-evenly;
    align-items: center;
}
.mediocampo{
    height: 15%;
    background-color: chartreuse;
    display: flex;
    flex-direction: row;
    justify-content: space-evenly;
    align-items: center;
}
.ataque{
    height: 15%;
    background-color: chartreuse;
    display: flex;
    flex-direction: row;
    justify-content: space-evenly;
    align-items: center;
}
.jugador{
    height: 75%;
    aspect-ratio: 1/1;
    background-color: rgb(86, 182, 182);
    border-color: white;
    border-style: solid;
    border-radius: 0.5%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.nombre {
    color: white;
    font-weight: bold;
    font-size: 0.5rem;       
    text-align: center;
    word-break: break-all;    
    font-family: sans-serif;
}



    </style>
</body>
</html>
