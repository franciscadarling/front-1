<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main class="pantalla">
        <section class="seccion-1"></section>
        <section class="seccion-2">
            <article class="cuadradito rojo"></article>
            <div class="texto"><p>texto texto texto texto</p></div>
        </section>
        <section class="seccion-3">
            <div class="coso">
                <article class="cuadradito rojo"></article>
                <div class="texto"><p>texto texto texto texto</p></div>
            </div>
            <div class="coso">
                <article class="cuadradito azul"></article>
                <div class="texto"><p>texto texto texto texto</p></div>
            </div>
            <div class="coso">
                    <article class="cuadradito amarillo"></article>
                    <div class="texto"><p>texto texto texto texto</p></div>
            </div>
            
        </section>
    </main>
    <style> 
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    }

    html, body {
    height: 100%;
    margin: 0;
    }
    .main{
        height: 100dvh;
        width: 100dvw;
    }
        .seccion-1{
            height: 25dvh;
            width: 100dvw;
        }
        .seccion-2{
            height: 35dvh;
            width: 100dvw;
            background-color:#c4edf1;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
        }
        .seccion-3{
            height: 40dvh;
            width: 100dvw;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-evenly;
        }
        .coso{
            width: 10dvw;
            height: 30dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .cuadradito{
        width: 10dvw;
        aspect-ratio: 1/1;
    }
    .texto{
        display: flex;
        flex:1;
        overflow-wrap: break-word;
        align-items: center;
        justify-content: center;
    }
    .azul{
        background-color: 
        #abe0e5;
    }
    .rojo{
        background-color: 
        #ff9978;
    }
    .amarillo{
        background-color: 
        #ffc86d;
    }
    </style>
</body>
</html>
